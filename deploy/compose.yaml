services:
  ferry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ferry:local
    # Preserve the layout of existing source-built installations.
    command: ["-data-dir", "/data", "-config", "/etc/ferry/config.yaml"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:17910:7900"
      - "127.0.0.1:17810:7890"
    volumes:
      - ferry-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  ferry-data:
