name: 功能建议 / Feature request
description: 说明场景、现有做法和希望改变的行为。 Describe the use case, alternatives and desired behavior.
body:
  - type: markdown
    attributes:
      value: |
        中文或英文填写即可，无需同时填写。 English or Chinese is welcome; one language is enough.
        大型变更建议先讨论范围再实现。 Discuss the scope before implementing a substantial change.
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / Problem
      description: 描述实际使用场景和当前限制。 Describe the actual use case and current limitation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望的行为 / Proposed behavior
      description: 给出具体例子和可验证的结果。 Give a concrete example and an observable outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案 / Alternatives
      description: 已经尝试什么，为什么仍需要改动？ What have you tried, and why is a change still needed?
  - type: textarea
    id: references
    attributes:
      label: 相关依据 / References
      description: 若涉及渠道或协议，附官方文档、客户端版本或脱敏复现。 For providers or protocols, include official documentation, client versions or a redacted reproduction.
