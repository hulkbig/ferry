<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">压测配置</title><desc id="desc">2026-10-30 · fixed versions · synthetic credentials · isolated network</desc><rect width="1200" height="680" rx="24" fill="#10151c"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="65" fill="#79d8ff" font-size="18" font-weight="700">FERRY / 1.1.0</text><text x="48" y="115" fill="#e9eef4" font-size="34" font-weight="700">压测配置</text><text x="48" y="150" fill="#92a5b7" font-size="17" font-weight="400">2026-10-30 · fixed versions · synthetic credentials · isolated network</text><rect x="48" y="200" width="355" height="245" rx="15" fill="#171e26"/><text x="68" y="245" fill="#79d8ff" font-size="21" font-weight="700">LOAD GENERATOR</text><text x="68" y="295" fill="#e9eef4" font-size="17" font-weight="400">2 vCPU</text><text x="68" y="339" fill="#e9eef4" font-size="17" font-weight="400">c32 / 200 requests per second</text><text x="68" y="383" fill="#e9eef4" font-size="17" font-weight="400">Validate content + status + SSE</text><rect x="423" y="200" width="355" height="245" rx="15" fill="#171e26"/><text x="443" y="245" fill="#79d8ff" font-size="21" font-weight="700">GATEWAY UNDER TEST</text><text x="443" y="295" fill="#e9eef4" font-size="17" font-weight="400">2 vCPU / 1536 MiB</text><text x="443" y="339" fill="#e9eef4" font-size="17" font-weight="400">One gateway at a time</text><text x="443" y="383" fill="#e9eef4" font-size="17" font-weight="400">CPU + memory + ledger counts</text><rect x="798" y="200" width="355" height="245" rx="15" fill="#171e26"/><text x="818" y="245" fill="#79d8ff" font-size="21" font-weight="700">MOCK UPSTREAM</text><text x="818" y="295" fill="#e9eef4" font-size="17" font-weight="400">2 vCPU</text><text x="818" y="339" fill="#e9eef4" font-size="17" font-weight="400">Delay / jitter / bytes / chunks</text><text x="818" y="383" fill="#e9eef4" font-size="17" font-weight="400">No paid or real upstream calls</text><text x="48" y="505" fill="#e9eef4" font-size="23" font-weight="700">1 KiB / 64 KiB JSON + SSE · ARM64 Linux Docker on Apple M1</text><text x="48" y="552" fill="#92a5b7" font-size="20" font-weight="400">Gateway features differ. sub2api also runs PostgreSQL and Redis.</text><text x="48" y="596" fill="#92a5b7" font-size="19" font-weight="400">Short runs: Ferry 3 x 15 s; CLIProxyAPI 3 x 12 s; sub2api 1 x 30 s.</text><text x="48" y="637" fill="#c79d63" font-size="17" font-weight="400">No claims for real-model tokens/s, multi-account OAuth or long-term capacity.</text></g></svg>