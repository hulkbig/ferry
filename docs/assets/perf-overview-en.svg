<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Deployment architecture</title><desc id="desc">Self-hosted AI gateway · Apache-2.0 · release candidate</desc><rect width="1200" height="680" rx="24" fill="#10151c"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="65" fill="#79d8ff" font-size="18" font-weight="700">FERRY / 1.1.0</text><text x="48" y="115" fill="#e9eef4" font-size="34" font-weight="700">Deployment architecture</text><text x="48" y="150" fill="#92a5b7" font-size="17" font-weight="400">Self-hosted AI gateway · Apache-2.0 · release candidate</text><rect x="48" y="190" width="355" height="160" rx="15" fill="#171e26"/><text x="72" y="225" fill="#79d8ff" font-size="17" font-weight="700">ONE PROCESS</text><text x="72" y="275" fill="#e9eef4" font-size="25" font-weight="700">Go + SQLite</text><text x="72" y="315" fill="#92a5b7" font-size="19" font-weight="400">No external database</text><rect x="423" y="190" width="355" height="160" rx="15" fill="#171e26"/><text x="447" y="225" fill="#79d8ff" font-size="17" font-weight="700">TWO MODES</text><text x="447" y="275" fill="#e9eef4" font-size="25" font-weight="700">Console / Headless</text><text x="447" y="315" fill="#92a5b7" font-size="19" font-weight="400">Same routing and audit</text><rect x="798" y="190" width="355" height="160" rx="15" fill="#171e26"/><text x="822" y="225" fill="#79d8ff" font-size="17" font-weight="700">PULL &amp; RUN</text><text x="822" y="275" fill="#e9eef4" font-size="25" font-weight="700">Docker image</text><text x="822" y="315" fill="#92a5b7" font-size="19" font-weight="400">AMD64 + ARM64</text><rect x="48" y="405" width="290" height="115" rx="15" fill="#171e26"/><text x="73" y="450" fill="#79d8ff" font-size="22" font-weight="700">CLIENTS</text><text x="73" y="488" fill="#e9eef4" font-size="18" font-weight="400">Agent / App / CLI</text><rect x="455" y="405" width="290" height="115" rx="15" fill="#171e26"/><text x="480" y="450" fill="#79d8ff" font-size="22" font-weight="700">FERRY</text><text x="480" y="488" fill="#e9eef4" font-size="18" font-weight="400">Route · Wait · Recover</text><rect x="862" y="405" width="290" height="115" rx="15" fill="#171e26"/><text x="887" y="450" fill="#79d8ff" font-size="22" font-weight="700">UPSTREAMS</text><text x="887" y="488" fill="#e9eef4" font-size="18" font-weight="400">API keys / OAuth</text><path d="M338 462 H445 M745 462 H852" stroke="#4bd9c4" stroke-width="4"/><path d="m432 452 13 10-13 10 m394-20 13 10-13 10" stroke="#4bd9c4" fill="none" stroke-width="3"/><text x="48" y="580" fill="#e9eef4" font-size="23" font-weight="400">Tools, streaming, usage and decision traces stay connected.</text><text x="48" y="625" fill="#92a5b7" font-size="18" font-weight="400">Recovery follows configured budgets and protocol compatibility.</text></g></svg>