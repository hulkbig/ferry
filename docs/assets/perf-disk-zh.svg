<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">账本磁盘占用</title><desc id="desc">Fresh volume · same 6,400 requests · no history deletion</desc><rect width="1200" height="680" rx="24" fill="#10151c"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="65" fill="#79d8ff" font-size="18" font-weight="700">FERRY / 1.1.0</text><text x="48" y="115" fill="#e9eef4" font-size="34" font-weight="700">账本磁盘占用</text><text x="48" y="150" fill="#92a5b7" font-size="17" font-weight="400">Fresh volume · same 6,400 requests · no history deletion</text><rect x="48" y="215" width="864.83292685993" height="64" rx="0" fill="#79d8ff"/><rect x="912.83292685993" y="215" width="99.17783420913685" height="64" rx="0" fill="#719c8b"/><rect x="1012.0107610690668" y="215" width="58.02428783345484" height="64" rx="0" fill="#c79d63"/><rect x="1070.0350489025216" y="215" width="77.96495109747819" height="64" rx="0" fill="#92a5b7"/><rect x="48" y="320" width="16" height="16" rx="3" fill="#79d8ff"/><text x="85" y="335" fill="#e9eef4" font-size="22" font-weight="400">Decision traces</text><text x="730" y="335" fill="#79d8ff" font-size="22" font-weight="700">31.27 MiB</text><rect x="48" y="372" width="16" height="16" rx="3" fill="#719c8b"/><text x="85" y="387" fill="#e9eef4" font-size="22" font-weight="400">Requests</text><text x="730" y="387" fill="#719c8b" font-size="22" font-weight="700">3.59 MiB</text><rect x="48" y="424" width="16" height="16" rx="3" fill="#c79d63"/><text x="85" y="439" fill="#e9eef4" font-size="22" font-weight="400">Attempts</text><text x="730" y="439" fill="#c79d63" font-size="22" font-weight="700">2.10 MiB</text><rect x="48" y="476" width="16" height="16" rx="3" fill="#92a5b7"/><text x="85" y="491" fill="#e9eef4" font-size="22" font-weight="400">Indexes &amp; other</text><text x="730" y="491" fill="#92a5b7" font-size="22" font-weight="700">2.82 MiB</text><text x="48" y="565" fill="#79d8ff" font-size="24" font-weight="700">6,400 requests · ~39.8 MiB ledger · ~6.5 KB added per request</text><text x="48" y="610" fill="#92a5b7" font-size="19" font-weight="400">Fresh-volume Mock run; audit retained; debug bodies OFF.</text><text x="48" y="642" fill="#92a5b7" font-size="17" font-weight="400">Storage footprint is not physical writes / IOPS. Other routes can cost more.</text></g></svg>