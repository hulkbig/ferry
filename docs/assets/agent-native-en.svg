<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 708" width="1040" height="708" role="img" aria-labelledby="title desc"><title id="title">Native tools for agents. Reviewable changes.</title><desc id="desc">Agents use the bundled Skill and management API to read evidence, simulate routes and prepare drafts. Authorized changes are revision-checked and read back.</desc><g style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1040" height="708" rx="24" fill="#11171d" stroke="none"/><text x="48" y="55" fill="#a2acb7" font-size="18" font-weight="600" text-anchor="start">FERRY / AGENT-NATIVE OPERATIONS</text><text x="48" y="111" fill="#ecf0f2" font-size="36" font-weight="650" text-anchor="start">Native tools for agents. Reviewable changes.</text><text x="48" y="151" fill="#a2acb7" font-size="22" font-weight="500" text-anchor="start">Dedicated identity · Versioned Skill · No host root access required</text><rect x="48" y="198" width="245" height="125" rx="18" fill="#1a222a" stroke="#35414b"/><text x="78" y="240" fill="#a5e8cf" font-size="18" font-weight="600" text-anchor="start">AGENT</text><text x="78" y="287" fill="#ecf0f2" font-size="25" font-weight="600" text-anchor="start">Your AI assistant</text><path d="M306 260 H369" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 253 L369 260 L362 267" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="389" y="198" width="603" height="125" rx="18" fill="#182923" stroke="#386355"/><text x="422" y="239" fill="#a5e8cf" font-size="22" font-weight="600" text-anchor="start">FERRY SKILL + MANAGEMENT API</text><text x="422" y="286" fill="#ecf0f2" font-size="25" font-weight="550" text-anchor="start">Inspect · Diagnose · Simulate · Change</text><path d="M690 323 V367 H520 V399" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M513 391 L520 399 L527 391" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="404" fill="#a2acb7" font-size="24" font-weight="550" text-anchor="start">From evidence to an applied change</text><rect x="48" y="438" width="218" height="147" rx="14" fill="#1a222a" stroke="#35414b"/><text x="68" y="471" fill="#a5e8cf" font-size="18" font-weight="650" text-anchor="start">01</text><text x="68" y="512" fill="#ecf0f2" font-size="23" font-weight="600" text-anchor="start">Read evidence</text><text x="68" y="552" fill="#a2acb7" font-size="17" font-weight="500" text-anchor="start">Requests and routes</text><path d="M272 510 H279" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 503 L279 510 L272 517" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="438" width="218" height="147" rx="14" fill="#1a222a" stroke="#35414b"/><text x="310" y="471" fill="#a5e8cf" font-size="18" font-weight="650" text-anchor="start">02</text><text x="310" y="512" fill="#ecf0f2" font-size="23" font-weight="600" text-anchor="start">Draft &amp; simulate</text><text x="310" y="552" fill="#a2acb7" font-size="17" font-weight="500" text-anchor="start">Inspect the impact</text><path d="M514 510 H521" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M514 503 L521 510 L514 517" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="532" y="438" width="218" height="147" rx="14" fill="#1a222a" stroke="#35414b"/><text x="552" y="471" fill="#a5e8cf" font-size="18" font-weight="650" text-anchor="start">03</text><text x="552" y="512" fill="#ecf0f2" font-size="23" font-weight="600" text-anchor="start">Review &amp; apply</text><text x="552" y="552" fill="#a2acb7" font-size="17" font-weight="500" text-anchor="start">Permission + revision</text><path d="M756 510 H763" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M756 503 L763 510 L756 517" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="774" y="438" width="218" height="147" rx="14" fill="#1a222a" stroke="#35414b"/><text x="794" y="471" fill="#a5e8cf" font-size="18" font-weight="650" text-anchor="start">04</text><text x="794" y="512" fill="#ecf0f2" font-size="23" font-weight="600" text-anchor="start">Verify result</text><text x="794" y="552" fill="#a2acb7" font-size="17" font-weight="500" text-anchor="start">Confirm actual state</text><path d="M48 626 H992" fill="none" stroke="#35414b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="669" fill="#a2acb7" font-size="21" font-weight="500" text-anchor="start">High-risk actions are permission-gated. Configuration changes remain auditable.</text></g></svg>
