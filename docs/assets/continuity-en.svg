<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 832" width="1040" height="832" role="img" aria-labelledby="title desc"><title id="title">Wait. Switch. Queue. Keep work moving.</title><desc id="desc">Three independent scenarios: wait through throttling, switch after failure, queue at capacity. Configuration, budgets and cancellation apply.</desc><g style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1040" height="832" rx="24" fill="#11171d" stroke="none"/><text x="48" y="55" fill="#a2acb7" font-size="18" font-weight="600" text-anchor="start">FERRY / REQUEST CONTINUITY</text><text x="48" y="111" fill="#ecf0f2" font-size="36" font-weight="650" text-anchor="start">Wait. Switch. Queue. Keep work moving.</text><text x="48" y="151" fill="#a2acb7" font-size="21" font-weight="500" text-anchor="start">Independent scenarios · Illustrative, not a measured trace</text><text x="48" y="213" fill="#a5e8cf" font-size="19" font-weight="600" text-anchor="start">01</text><text x="94" y="213" fill="#ecf0f2" font-size="27" font-weight="600" text-anchor="start">Rate limit</text><rect x="48" y="238" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="71" cy="263" r="4" fill="#e8bc7b"/><text x="84" y="269" fill="#e8bc7b" font-size="15" font-weight="600" text-anchor="start">429</text><text x="68" y="307" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Rate limited</text><path d="M330 284 H366" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 277 L366 284 L359 291" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="386" y="238" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="409" cy="263" r="4" fill="#ecf0f2"/><text x="422" y="269" fill="#ecf0f2" font-size="15" font-weight="600" text-anchor="start">WAIT</text><text x="406" y="307" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Wait within budget</text><path d="M668 284 H704" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M697 277 L704 284 L697 291" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="724" y="238" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="747" cy="263" r="4" fill="#a5e8cf"/><text x="760" y="269" fill="#a5e8cf" font-size="15" font-weight="600" text-anchor="start">CONTINUE</text><text x="744" y="307" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Resume response</text><path d="M48 354 H992" fill="none" stroke="#27313a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="395" fill="#a5e8cf" font-size="19" font-weight="600" text-anchor="start">02</text><text x="94" y="395" fill="#ecf0f2" font-size="27" font-weight="600" text-anchor="start">Upstream failure</text><rect x="48" y="420" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="71" cy="445" r="4" fill="#e8bc7b"/><text x="84" y="451" fill="#e8bc7b" font-size="15" font-weight="600" text-anchor="start">ERROR</text><text x="68" y="489" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Attempt fails</text><path d="M330 466 H366" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 459 L366 466 L359 473" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="386" y="420" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="409" cy="445" r="4" fill="#ecf0f2"/><text x="422" y="451" fill="#ecf0f2" font-size="15" font-weight="600" text-anchor="start">SWITCH</text><text x="406" y="489" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Try fallback</text><path d="M668 466 H704" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M697 459 L704 466 L697 473" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="724" y="420" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="747" cy="445" r="4" fill="#a5e8cf"/><text x="760" y="451" fill="#a5e8cf" font-size="15" font-weight="600" text-anchor="start">CONTINUE</text><text x="744" y="489" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Continue response</text><path d="M48 536 H992" fill="none" stroke="#27313a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="577" fill="#a5e8cf" font-size="19" font-weight="600" text-anchor="start">03</text><text x="94" y="577" fill="#ecf0f2" font-size="27" font-weight="600" text-anchor="start">Concurrency</text><rect x="48" y="602" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="71" cy="627" r="4" fill="#e8bc7b"/><text x="84" y="633" fill="#e8bc7b" font-size="15" font-weight="600" text-anchor="start">FULL</text><text x="68" y="671" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">At capacity</text><path d="M330 648 H366" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 641 L366 648 L359 655" fill="none" stroke="#e8bc7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="386" y="602" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="409" cy="627" r="4" fill="#ecf0f2"/><text x="422" y="633" fill="#ecf0f2" font-size="15" font-weight="600" text-anchor="start">QUEUE</text><text x="406" y="671" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Queue by policy</text><path d="M668 648 H704" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M697 641 L704 648 L697 655" fill="none" stroke="#a5e8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="724" y="602" width="268" height="92" rx="12" fill="#1a222a" stroke="#35414b"/><circle cx="747" cy="627" r="4" fill="#a5e8cf"/><text x="760" y="633" fill="#a5e8cf" font-size="15" font-weight="600" text-anchor="start">RUN</text><text x="744" y="671" fill="#ecf0f2" font-size="24" font-weight="550" text-anchor="start">Run when admitted</text><path d="M48 756 H992" fill="none" stroke="#35414b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="795" fill="#a2acb7" font-size="21" font-weight="500" text-anchor="start">Bounded recovery. Cancellation respected. No stream switching after visible output.</text></g></svg>
